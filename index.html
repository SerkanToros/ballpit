});
document.getElementById("b-defaults").addEventListener("click", () => {
  applyPreset("Ball Pit");
  presetSel.value = "Ball Pit";
  say("Back to defaults.");
});

/* ===========================================================================
   13. Self-test
   ---------------------------------------------------------------------------
   Headless. Drives the same code path the animation loop does, so anything it
   proves is true of the running toy. Call window.__selftest() from a console.
   =========================================================================== */

function simulate(seconds, frameDt, applyCfg, opts) {
  const saved = {};
  if (applyCfg) for (const k in applyCfg) { saved[k] = cfg[k]; cfg[k] = applyCfg[k]; }
  rngState = 12345;
  geometry(); buildGrid(); buildColors();
  spawn(cfg.count | 0);
  if (opts && opts.column) {
    // A compact column standing ON the floor, at rest. Releasing this is a
    // slump test: friction decides what slope survives. The earlier version
    // spread the balls over the whole box height, which jammed floor to
    // ceiling and measured the violence of the collapse instead.
    const mx = (boxX0 + boxX1) * 0.5;
    const d = baseR * 2.02;
    const perRow = Math.max(1, Math.round(opts.width || 10));
    for (let i = 0; i < count; i++) {
      const c = i % perRow, r = (i / perRow) | 0;
      px[i] = mx + (c - (perRow - 1) / 2) * d + (rnd() - 0.5) * baseR * 0.04;
      py[i] = boxY1 - rad[i] - r * d;
      pz[i] = DZ * 0.5;
      vx[i] = vy[i] = vz[i] = 0;
    }
  }
  acc = 0;
  const wasPaused = paused; paused = false;
  const n = Math.round(seconds / frameDt);
  for (let f = 0; f < n; f++) tick(frameDt * cfg.timeScale);
  paused = wasPaused;

  let bad = 0, escaped = 0, maxOv = 0, ke = 0, top = H, bottom = 0;
  const ovs = [];
  for (let i = 0; i < count; i++) {
    if (!isFinite(px[i]) || !isFinite(py[i]) || !isFinite(pz[i]) ||
        !isFinite(vx[i]) || !isFinite(vy[i]) || !isFinite(vz[i])) bad++;
    const r = rad[i];
    if (px[i] < boxX0 - r || px[i] > boxX1 + r ||
        py[i] < boxY0 - r || py[i] > boxY1 + r ||
        pz[i] < -r || pz[i] > DZ + r) escaped++;
    ke += vx[i] * vx[i] + vy[i] * vy[i] + vz[i] * vz[i];
    if (py[i] < top) top = py[i];
    if (py[i] > bottom) bottom = py[i];
  }
  hashParticles();
  const layer = gcols * grows;
  for (let a = 0; a < count; a++) {
    const c = cellOf[a], cz = (c / layer) | 0, rem = c - cz * layer;
    const cy = (rem / gcols) | 0, cx = rem - cy * gcols;
    for (let z = cz - 1; z <= cz + 1; z++) { if (z < 0 || z >= gdeps) continue;
      for (let y = cy - 1; y <= cy + 1; y++) { if (y < 0 || y >= grows) continue;
        for (let x = cx - 1; x <= cx + 1; x++) { if (x < 0 || x >= gcols) continue;
          const cell = z * layer + y * gcols + x, end = starts[cell + 1];
          for (let k = starts[cell]; k < end; k++) {
            const b = order[k];
            if (b <= a) continue;
            const dx = px[b] - px[a], dy = py[b] - py[a], dz = pz[b] - pz[a];
            const minD = rad[a] + rad[b];
            const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
            if (d < minD) { const ov = (minD - d) / minD; ovs.push(ov); if (ov > maxOv) maxOv = ov; }
          }
        }
      }
    }
  }
  const snap = {x: Float32Array.from(px.subarray(0, count)), y: Float32Array.from(py.subarray(0, count))};
  if (applyCfg) for (const k in saved) cfg[k] = saved[k];
  ovs.sort((a, b) => a - b);
  const pct = f => ovs.length ? ovs[Math.min(ovs.length - 1, Math.floor(ovs.length * f))] : 0;
  return {bad, escaped, maxOverlap: maxOv, medOverlap: pct(0.5), p99Overlap: pct(0.99),
          contacts: ovs.length, ke: ke / Math.max(1, count) / (H * H), top, bottom, snap, n: count};
}

window.__selftest = function () {
  const out = [];
  const ok = (name, cond, detail) => out.push({name, pass: !!cond, detail});
  const savedCount = count;

  /* 1. Stability at the parameter corners ------------------------------- */
  const corners = [
    ["max gravity",  {gravity: 4, count: 700, substeps: 1, gravSource: "fixed", gravAngle: 90}],
    ["max bounce",   {bounce: 0.95, wallBounce: 0.95, count: 700, gravSource: "fixed", gravAngle: 90}],
    // Deliberately mush: 5% of the overlap removed once per substep. Deep
    // interpenetration is the CORRECT answer here, so this corner is checked
    // for integrity only — asserting rigidity would be asserting that the
    // stiffness slider does not work.
    ["soft solver",  {stiffness: 0.05, iterations: 1, count: 700, gravSource: "fixed", gravAngle: 90}, "soft"],
    ["dense pack",   {count: 2600, ballSize: 0.55, gravSource: "fixed", gravAngle: 90}],
    ["deep pit",     {slabDepth: 12, count: 1500, gravSource: "fixed", gravAngle: 90}],
    ["max cohesion", {cohesion: 3, cohesionRange: 1.5, count: 600, gravSource: "fixed", gravAngle: 90}],
    ["heavy stir",   {friction: 1.5, drag: 6, count: 600, gravSource: "fixed", gravAngle: 90}]
  ];
  for (const [name, c, mode] of corners) {
    const r = simulate(3, 1 / 60, c);
    if (mode === "soft") {
      ok("stable: " + name, r.bad === 0 && r.escaped === 0 && isFinite(r.ke),
         "integrity only — nan=" + r.bad + " esc=" + r.escaped +
         " overlap med=" + r.medOverlap.toFixed(3) + " (mush is expected)");
      continue;
    }
    // Judged on the distribution. A compliant solver always has one worst
    // contact somewhere, and at the abusive corners (one substep, four g) that
    // pair can sit deep without anything being wrong; what would signal a real
    // blow-up is the whole pile going soft, or NaN, or a ball leaving the box.
    ok("stable: " + name,
       r.bad === 0 && r.escaped === 0 && isFinite(r.ke) &&
       r.medOverlap < 0.12 && r.p99Overlap < 0.45 && r.maxOverlap < 0.75,
       "nan=" + r.bad + " esc=" + r.escaped + " overlap med=" + r.medOverlap.toFixed(3) +
       " p99=" + r.p99Overlap.toFixed(3) + " max=" + r.maxOverlap.toFixed(3));
  }

  /* 2. Frame rate independence — the v1 bug ------------------------------ */
  const base = {count: 500, gravSource: "fixed", gravAngle: 90, shakeImpulse: 0, ballSize: 1};
  const a60 = simulate(4, 1 / 60, base);
  const a120 = simulate(4, 1 / 120, base);
  const a30 = simulate(4, 1 / 30, base);
  const dev = (p, q) => {
    let s = 0;
    for (let i = 0; i < p.snap.x.length; i++) s += Math.hypot(p.snap.x[i] - q.snap.x[i], p.snap.y[i] - q.snap.y[i]);
    return s / p.snap.x.length / H;
  };
  const d120 = dev(a60, a120), d30 = dev(a60, a30);
  ok("60 Hz matches 120 Hz", d120 < 0.005, "mean drift " + (d120 * 100).toFixed(3) + "% of screen");
  ok("60 Hz matches 30 Hz",  d30 < 0.02,  "mean drift " + (d30 * 100).toFixed(3) + "% of screen");

  /* 2b. The pile must actually FALL, at every substep count --------------
     A frozen simulation passes an overlap check perfectly and passes the
     frame-rate check too, because both frame rates freeze identically. This
     is the check that caught rest damping crushing gravity at 3+ substeps. */
  for (const sb of [1, 2, 3, 4, 6, 8]) {
    simulate(2.5, 1 / 60, {count: 400, substeps: sb, gravSource: "fixed", gravAngle: 90});
    let sum = 0;
    for (let i = 0; i < count; i++) sum += py[i];
    const meanY = sum / count;
    ok("falls at " + sb + " substep" + (sb > 1 ? "s" : ""), meanY > boxY0 + (boxY1 - boxY0) * 0.55,
       "mean y " + (meanY / H * 100).toFixed(0) + "% down the box");
  }

  /* 2c. What is DRAWN must move smoothly, even when stepping does not ----
     The accumulator gives a frame 0, 1 or 2 physics steps depending on where
     the frame boundary falls — at 120 Hz with 2 substeps it alternated 0 and 2
     — and drawing the raw state made the whole pit stutter even though the
     simulation was perfectly regular. The renderer interpolates between the
     last two states so the drawn position advances with real time instead.
     Measured on one ball at constant velocity, where every frame must cover
     the same distance. The residual tracks the frame-time jitter itself. */
  for (const [hz, subs] of [[120, 2], [120, 3], [60, 2], [144, 2]]) {
    simulate(0.2, 1 / 60, {count: 1, gravity: 0, gravSource: "fixed", substeps: subs,
                           drag: 0, restSpeed: 0});
    cfg.gravity = 0; cfg.gravSource = "fixed"; cfg.substeps = subs;
    cfg.drag = 0; cfg.restSpeed = 0;
    px[0] = W * 0.05; py[0] = H * 0.5; vx[0] = 90; vy[0] = 0;
    const step = [];
    let prev = null;
    for (let f = 0; f < 240; f++) {
      tick((1000 / hz + (rnd() - 0.5) * 1.6) / 1000);
      render();
      if (f > 20 && prev !== null) step.push(rx[0] - prev);
      prev = rx[0];
    }
    const mean = step.reduce((a, b) => a + b, 0) / step.length;
    const cv = Math.sqrt(step.reduce((a, b) => a + (b - mean) * (b - mean), 0) / step.length) / mean;
    ok("smooth at " + hz + "Hz/" + subs + " sub", cv < 0.12,
       "drawn motion varies " + (cv * 100).toFixed(1) + "% frame to frame");
  }

  /* 3. Friction holds a slope --------------------------------------------
     Measured as the free-surface angle after the box is tilted 25 degrees. A
     frictionless liquid ends up parallel to world horizontal, which is -25 in
     box coordinates; a material with grip stops short of that.

     Wall grip is pinned at 1 on purpose. With a slippery floor the whole mass
     creeps along it no matter how much the balls grip each other, which hides
     the particle friction completely — three earlier versions of this test
     read "friction does nothing" for exactly that reason. */
  const surfaceAngle = () => {
    const BINS = 16, top = new Array(BINS).fill(1e9);
    for (let i = 0; i < count; i++) {
      const b = Math.min(BINS - 1, Math.max(0, Math.floor(px[i] / W * BINS)));
      if (py[i] < top[b]) top[b] = py[i];
    }
    let n = 0, sx = 0, sy = 0, sxy = 0, sxx = 0;
    for (let b = 0; b < BINS; b++) {
      if (top[b] > 1e8) continue;
      const x = (b + 0.5) / BINS * W;
      n++; sx += x; sy += top[b]; sxy += x * top[b]; sxx += x * x;
    }
    return Math.atan((n * sxy - sx * sy) / (n * sxx - sx * sx)) * 180 / Math.PI;
  };
  const tiltTo = mu => {
    // Every value this depends on is set explicitly. It used to inherit
    // gravity from whatever ran before it, and the judder check leaves gravity
    // at zero — which made the surface sit flat in both runs and read as
    // "friction does nothing" for a third time.
    simulate(5, 1 / 60, {count: 500, ballSize: 0.8, gravity: 1, gravSource: "fixed",
      gravAngle: 90, slabDepth: 1, restSpeed: 0, bounce: 0, friction: mu,
      wallFriction: 1, drag: 0.35, substeps: 2});
    cfg.gravity = 1; cfg.gravSource = "fixed"; cfg.gravAngle = 65; cfg.gravZ = 0;
    cfg.friction = mu; cfg.wallFriction = 1; cfg.restSpeed = 0;
    cfg.bounce = 0; cfg.slabDepth = 1; cfg.drag = 0.35; cfg.substeps = 2;
    for (let f = 0; f < 360; f++) tick(1 / 60);
    return surfaceAngle();
  };
  const slickA = tiltTo(0), gripA = tiltTo(2);
  ok("friction holds a slope", gripA - slickA > 2,
     "surface " + slickA.toFixed(1) + " deg at mu=0 vs " + gripA.toFixed(1) +
     " deg at mu=2 (a liquid reaches -25)");

  /* 4. Depth 1 collapses to a plane ------------------------------------- */
  simulate(2, 1 / 60, {slabDepth: 1, count: 400, gravSource: "fixed", gravAngle: 90});
  let planar = 0;
  for (let i = 0; i < count; i++) if (Math.abs(pz[i] - DZ * 0.5) > 1e-3 || vz[i] !== 0) planar++;
  ok("depth 1 is planar", planar === 0, planar + " balls left the plane");

  /* 5. Every preset survives a round trip -------------------------------- */
  let rtBad = 0, rtName = "";
  for (const name in PRESETS) {
    const src = PRESETS[name];
    for (const p of PARAMS) cfg[p.k] = (p.k in src) ? src[p.k] : p.d;
    const s = JSON.parse(JSON.stringify(sparse()));
    for (const p of PARAMS) cfg[p.k] = p.d;
    loadSparse(s);
    for (const p of PARAMS) {
      const want = (p.k in src) ? src[p.k] : p.d;
      if (cfg[p.k] !== want) { rtBad++; rtName = name + "." + p.k; }
    }
  }
  ok("preset round trip", rtBad === 0, rtBad ? "first mismatch " + rtName : "all presets");

  /* 5b. The renderer draws, and the shade ladder really is a ladder ------ */
  applyPreset("Ball Pit");
  spawn(600);
  for (let f = 0; f < 90; f++) tick(1 / 60);

  const meanLuma = () => {
    const d = ctx.getImageData(0, 0, W, H).data;
    let sum = 0, n = 0;
    for (let i = 0; i < d.length; i += 4 * 11) { sum += (d[i] + d[i + 1] + d[i + 2]) / 3; n++; }
    return sum / n;
  };
  render();
  const withBalls = meanLuma();
  const keep = count; count = 0; render(); const bare = meanLuma(); count = keep;
  ok("renderer draws balls", withBalls > bare * 1.15,
     "mean luma " + withBalls.toFixed(1) + " with balls vs " + bare.toFixed(1) + " backdrop only");

  // Each rung of the ladder must be darker than the one before it, or depth
  // and occlusion have nothing to select between.
  orientSprites(cfg.lightAngle);
  const rungLuma = [];
  for (let sIdx = 0; sIdx < NSHADE; sIdx++) {
    const c = sphereSprites[0][sIdx].getContext("2d").getImageData(0, 0, SPR, SPR).data;
    let sum = 0, n = 0;
    for (let i = 0; i < c.length; i += 4) {
      if (c[i + 3] < 200) continue;
      sum += (c[i] + c[i + 1] + c[i + 2]) / 3; n++;
    }
    rungLuma.push(n ? sum / n : 0);
  }
  let monotone = true;
  for (let sIdx = 1; sIdx < rungLuma.length; sIdx++) if (rungLuma[sIdx] >= rungLuma[sIdx - 1]) monotone = false;
  ok("shade ladder descends", monotone,
     "lit rung " + rungLuma[0].toFixed(0) + " down to buried rung " + rungLuma[rungLuma.length - 1].toFixed(0));

  // Matte and glow must not be the same picture.
  cfg.renderMode = "matte"; render(); const matteL = meanLuma();
  cfg.renderMode = "glow";  render(); const glowL = meanLuma();
  cfg.renderMode = "matte";
  ok("styles differ", Math.abs(matteL - glowL) > 2,
     "matte luma " + matteL.toFixed(1) + " vs glow " + glowL.toFixed(1));

  /* 6. Sprite ladder is complete ---------------------------------------- */
  applyPreset("Ball Pit");
  orientSprites(cfg.lightAngle);
  const shaped = sphereSprites.length === ballColors.length &&
                 sphereSprites.every(r => r.length === NSHADE);
  ok("sprite ladder", shaped, sphereSprites.length + " colours x " + NSHADE + " shades");

  count = savedCount;
  spawn(cfg.count | 0);
  const passed = out.filter(r => r.pass).length;
  console.table(out);
  console.log(passed + "/" + out.length + " checks passed");
  return {passed, total: out.length, results: out};
};

/* ===========================================================================
   14. Start
   =========================================================================== */

const gate = document.getElementById("gate");

window.addEventListener("resize", resize);
if (screen.orientation) screen.orientation.addEventListener("change", () => setTimeout(resize, 120));

restore();
buildColors();
buildSprites();
resize();
spawn(cfg.count | 0);
overlays();
buildPresetList();
buildChips();
buildRows();
noteEl.textContent = HINT;
dimHandle();
requestAnimationFrame(frame);

document.getElementById("gate-go").addEventListener("click", async () => {
  const ok = await enableSensors();
  gate.classList.add("hidden");
  try { await document.documentElement.requestFullscreen({navigationUI: "hide"}); } catch (_) {}
  try { wakeLock = await navigator.wakeLock.request("screen"); awakeBtn.classList.add("on"); } catch (_) {}

  setTimeout(() => {
    if (!sensorLive) {
      cfg.showSensors = true; overlays();
      noteEl.textContent = ok
        ? "No motion events are arriving — the readout top-left says why. Set Forces > Gravity from to Pointer or Orbit to tune without tilt."
        : "Motion permission was declined. Set Forces > Gravity from to Pointer or Orbit, or drag to stir.";
    } else {
      noteEl.textContent = HINT;
    }
  }, 1500);
});

window.__sim = {cfg, PARAMS, PRESETS, simulate, tick, spawn, geometry, buildGrid, render, ctx,
  sprites: () => ({canon: canonSprites, live: sphereSprites, shadow: shadowSprite, glow: glowSprites}),
  steps: () => stepsLast,
  state: () => ({count, W, H, DZ, baseR, px, py, pz, rx, ry, rz, vx, vy, vz, rad, nCount, frontN, occ, OCC_FULL})};
